<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Which Dragon Are You? 🎀🐉</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Hello Kitty Floating Decor (Updated URLs) -->
  <img src="https://raw.githubusercontent.com/twitter/twemoji/master/assets/svg/1f380.svg" class="kitty-corner float-left" alt="Ribbon Left">
  <img src="https://raw.githubusercontent.com/twitter/twemoji/master/assets/svg/1f380.svg" class="kitty-corner float-right" alt="Hello Kitty Right" crossorigin="anonymous">

  <div class="quiz-card">

  <div class="quiz-card">
    <header class="quiz-header">
      <div class="badge">🎀 Personality Quiz • Find Your Dragon Persona</div>
      <h1>Which Dragon Are You? 🐉✨</h1>
      <p class="subtitle">Answer 15 questions to discover your mythical dragon personality!</p>
    </header>

    <main class="quiz-body" id="quiz-container">
      <!-- Questions rendered via JavaScript -->
    </main>

    <footer class="quiz-footer">
      <button id="submit-btn" onclick="submitQuiz()">Discover My Dragon Self 💖</button>
      
      <!-- Result Modal Box -->
      <div id="result-modal" class="result-box hidden">
        <div class="result-icon" id="result-icon">🐉</div>
        <h2 id="result-title">Your Dragon Personality</h2>
        <p id="result-desc">Dragon description goes here...</p>
        <button class="retry-btn" onclick="resetQuiz()">Take Quiz Again 🔄</button>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
